name: HealthApp
options:
  bundleIdPrefix: com.garysun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    COMPILER_INDEX_STORE_ENABLE: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
packages:
  HealthCore:
    path: HealthCore
targets:
  HealthApp:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garysun.healthapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HealthCore
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Breathing Room   # final product name (HackRice)
        NSMicrophoneUsageDescription: "Breathing Room uses the microphone so you can log health notes by voice."
        NSSpeechRecognitionUsageDescription: "Breathing Room transcribes your voice notes into your health timeline."
        NSHealthShareUsageDescription: "Breathing Room reads steps, sleep, heart rate, workouts, and nutrition to correlate them with your symptoms."
        NSHealthUpdateUsageDescription: "Breathing Room writes demo sample data in demo mode only."
        NSCalendarsFullAccessUsageDescription: "Breathing Room looks for upcoming doctor appointments to help you prepare."
        NSLocationWhenInUseUsageDescription: "Breathing Room uses your location to look up local air quality."
        ITSAppUsesNonExemptEncryption: false
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: HealthApp
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: HealthApp
schemes:
  HealthApp:
    build:
      targets:
        HealthApp: all
    test:
      gatherCoverageData: false
      targets: [AppTests, AppUITests]
